[hooks]
enter = """
mise install --quiet
if [ -f .env.local ]; then
  export $(grep -v '^[[:space:]]*#' .env.local | grep '=' | sed 's/[[:space:]]*#[^=]*$//' | xargs)
fi
uv sync
"""

[tools]
python = "3.14"
uv = "latest"

[env]
_.file = [".env", ".env.local"]
APP_ENV = "development"

# ---------------------------------------------------------------------------
# Top-level convenience tasks
# ---------------------------------------------------------------------------

[tasks.default]
description = "List all available tasks"
run = "mise tasks"

[tasks.init-env]
description = "Copy all *.env.*example files to *.env*"
alias = "ie"
run = """
env_files=$(find . -type f -name "*.env.*example")
for f in $env_files; do
  target=$(echo "$f" | sed -e "s/.example$//")
  cp -n "$f" "$target" && chmod 766 "$target"
done
echo "Environment files initialized, you may want to edit them now"
echo "Here are the files that were initialized:"
for f in $env_files; do
  target=$(echo "$f" | sed -e "s/.example$//")
  ls -la "$target" 2>/dev/null || true
done
"""

[tasks.dev]
description = "▶  Start dev server (watch mode) + full dev stack (db + redis)"
run = [
  "docker compose --profile dev-stack up -d --remove-orphans",
  "uv run alembic -c resources/alembic.ini upgrade head",
  "uv run uvicorn server:app --app-dir resources --reload --host 0.0.0.0 --port 8080",
]

[tasks.test]
description = "🧪  Run full test suite"
run = "uv run pytest resources/tests --cov=resources/src --cov-report=term-missing"

[tasks.migrate]
description = "🗄  Apply pending DB migrations"
run = "uv run alembic -c resources/alembic.ini upgrade head"

[tasks.up]
description = "🐳  Start full dev stack (app + db + redis)"
run = "docker compose --profile services up -d --remove-orphans"

[tasks.up-ui]
description = "🐳  Start full stack + admin UIs"
run = "docker compose --profile services --profile ui up -d --remove-orphans"

[tasks.up-monitoring]
description = "🐳  Start full stack + monitoring exporters"
run = "docker compose --profile services --profile monitoring up -d --remove-orphans"

[tasks.down]
description = "🐳  Stop dev stack"
run = "docker compose --profile services --profile ui --profile monitoring down"

[tasks.logs]
description = "📋  Follow container logs (optional: pass service name)"
run = "docker compose logs -f $@"

[tasks.lint]
description = "🔍  Run linter"
run = "uv run ruff check resources/src resources/scripts resources/tests"

[tasks.format]
description = "✨  Auto-format code"
run = [
  "uv run ruff check --select I --fix resources/src resources/scripts resources/tests",
  "uv run ruff format resources/src resources/scripts resources/tests",
]

[tasks.sync]
description = "📦  Sync deps from uv.lock"
run = "uv sync"

# ---------------------------------------------------------------------------
# dev:* — application server
# ---------------------------------------------------------------------------

[tasks."dev:start"]
description = "Start Uvicorn with --reload"
run = "uv run uvicorn server:app --app-dir resources --reload --host 0.0.0.0 --port 8080"

# ---------------------------------------------------------------------------
# test:* — test suite
# ---------------------------------------------------------------------------

[tasks."test:run"]
description = "Run full test suite with coverage"
run = "uv run pytest resources/tests --cov=resources/src --cov-report=term-missing"

[tasks."test:unit"]
description = "Run unit tests only"
run = "uv run pytest resources/tests/unit -v"

[tasks."test:integration"]
description = "Run integration tests only"
run = "uv run pytest resources/tests/integration -v"

# ---------------------------------------------------------------------------
# db:* — database migrations
# ---------------------------------------------------------------------------

[tasks."db:migrate"]
description = "Apply pending Alembic migrations"
run = "uv run alembic -c resources/alembic.ini upgrade head"

[tasks."db:new"]
description = "Generate a new migration — usage: mise run db:new <name>"
run = "uv run alembic -c resources/alembic.ini revision --autogenerate -m \"$1\""

[tasks."db:rollback"]
description = "Rollback one migration step"
run = "uv run alembic -c resources/alembic.ini downgrade -1"

[tasks."db:history"]
description = "Show full migration history"
run = "uv run alembic -c resources/alembic.ini history --verbose"

[tasks."db:seed"]
description = "🌱  Seed default roles and permissions (idempotent)"
run = "uv run python resources/scripts/seed_roles.py"

# ---------------------------------------------------------------------------
# docker:* — container management
# ---------------------------------------------------------------------------

[tasks."docker:up"]
description = "Start full dev stack (app + db + redis)"
run = "docker compose --profile services up -d --remove-orphans"

[tasks."docker:up-ui"]
description = "Start full stack + all UI companions (pgAdmin, RedisInsight)"
run = "docker compose --profile services --profile ui up -d --remove-orphans"

[tasks."docker:up-monitoring"]
description = "Start full stack + all monitoring exporters"
run = "docker compose --profile services --profile monitoring up -d --remove-orphans"

[tasks."docker:down"]
description = "Stop and remove all containers"
run = "docker compose --profile services --profile ui --profile monitoring down"

[tasks."docker:restart"]
description = "Restart all services"
run = "docker compose --profile services restart"

[tasks."docker:build"]
description = "Rebuild the app image"
run = "docker compose --profile services build"

[tasks."docker:ps"]
description = "List running containers and their status"
run = "docker compose ps"

[tasks."docker:logs"]
description = "Follow logs (pass service name as arg for one container, default all)"
run = "docker compose logs -f $@"

[tasks."docker:clean"]
description = "⚠  Stop containers and delete all volumes (destructive)"
run = "docker compose --profile services --profile ui --profile monitoring down -v --remove-orphans"

[tasks."docker:dev-stack-up"]
description = "Start db + redis without app (for running app locally)"
alias = "ds-up"
run = "docker compose --profile dev-stack up -d --remove-orphans"

[tasks."docker:dev-stack-ui"]
description = "Start db + redis + their UIs (pgAdmin, RedisInsight)"
alias = "ds-ui"
run = "docker compose --profile dev-stack --profile ui up -d --remove-orphans"

[tasks."docker:app-up"]
description = "Start app service only"
run = "docker compose -f .docker/project/compose.yml --profile services up -d --remove-orphans"

[tasks."docker:app-logs"]
description = "Follow app container logs"
run = "docker compose -f .docker/project/compose.yml logs -f"

[tasks."docker:app-restart"]
description = "Restart app container"
run = "docker compose -f .docker/project/compose.yml restart"

[tasks."docker:db-up"]
description = "Start PostgreSQL only"
run = "docker compose -f .docker/dev-stacks/postgresql/compose.yml --profile services up -d --remove-orphans"

[tasks."docker:db-ui"]
description = "Start PostgreSQL + pgAdmin UI"
run = "docker compose -f .docker/dev-stacks/postgresql/compose.yml --profile services --profile ui up -d --remove-orphans"

[tasks."docker:db-logs"]
description = "Follow PostgreSQL container logs"
run = "docker compose -f .docker/dev-stacks/postgresql/compose.yml logs -f db"

[tasks."docker:db-restart"]
description = "Restart PostgreSQL container"
run = "docker compose -f .docker/dev-stacks/postgresql/compose.yml restart db"

[tasks."docker:redis-up"]
description = "Start Redis only"
run = "docker compose -f .docker/dev-stacks/redis/compose.yml --profile services up -d --remove-orphans"

[tasks."docker:redis-ui"]
description = "Start Redis + RedisInsight UI"
run = "docker compose -f .docker/dev-stacks/redis/compose.yml --profile services --profile ui up -d --remove-orphans"

[tasks."docker:redis-logs"]
description = "Follow Redis container logs"
run = "docker compose -f .docker/dev-stacks/redis/compose.yml logs -f redis"

[tasks."docker:redis-restart"]
description = "Restart Redis container"
run = "docker compose -f .docker/dev-stacks/redis/compose.yml restart redis"

# ---------------------------------------------------------------------------
# deps:* — dependency management
# ---------------------------------------------------------------------------

[tasks."deps:sync"]
description = "Sync deps from uv.lock (installs missing, removes extra)"
run = "uv sync"

[tasks."deps:add"]
description = "Add a runtime dependency — usage: mise run deps:add <package>"
run = "uv add $1"

[tasks."deps:add-dev"]
description = "Add a dev dependency — usage: mise run deps:add-dev <package>"
run = "uv add --group dev $1"

[tasks."deps:update"]
description = "Upgrade all deps and regenerate uv.lock"
run = "uv lock --upgrade"

# ---------------------------------------------------------------------------
# lint:* — code quality
# ---------------------------------------------------------------------------

[tasks."lint:check"]
description = "Run ruff linter (report only)"
run = "uv run ruff check resources/src resources/scripts resources/tests"

[tasks."lint:format"]
description = "Run ruff formatter (imports + style)"
run = [
  "uv run ruff check --select I --fix resources/src resources/scripts resources/tests",
  "uv run ruff format resources/src resources/scripts resources/tests",
]

[tasks."lint:fix"]
description = "Auto-fix lint issues in place"
run = "uv run ruff check --fix resources/src resources/scripts resources/tests"

