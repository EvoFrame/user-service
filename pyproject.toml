[project]
name = "user-service"
version = "0.1.0"
description = "User profile and preferences service for EvoFrame"
authors = [{ name = "EvoFrame" }]
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.13",
  "asyncpg>=0.29",
  "fastapi>=0.115",
  "gunicorn>=22.0",
  "httpx>=0.27",
  "prometheus-fastapi-instrumentator>=7.0",
  "psycopg2-binary>=2.9.12",
  "pydantic-settings>=2.0",
  "pyjwt[crypto]>=2.8",
  "redis>=5.0",
  "sqlmodel>=0.0.21",
  "structlog>=24.0",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "testcontainers[postgres,redis]>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["resources/tests"]
pythonpath = ["resources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff]
line-length = 120
